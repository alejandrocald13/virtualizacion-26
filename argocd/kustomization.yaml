apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-racm
resources:
  - 00-namespace.yaml
  - install.yaml
  - ingress.yaml
  - repository.yaml
patches:
  - target:
      kind: ClusterRoleBinding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: argocd-racm
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
