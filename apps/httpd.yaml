apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd
  namespace: parcial-racm
  labels:
    app: httpd
spec:
  replicas: 3
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd
  namespace: parcial-racm
spec:
  type: ClusterIP
  selector:
    app: httpd
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: httpd
  namespace: parcial-racm
spec:
  ingressClassName: traefik
  rules:
    - host: httpd.racm.assessment2
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: httpd
                port:
                  number: 80
