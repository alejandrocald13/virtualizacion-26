server:
  retention: "3d"
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.racm.assessment6
    path: /
    pathType: Prefix

scrapeConfigs:
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    pre_relabel_configs: |
      - source_labels:
          - __meta_kubernetes_namespace
        regex: metallb-system
        action: drop

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
